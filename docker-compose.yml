services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://kicca:${POSTGRES_PASSWORD:-kicca}@postgres:5432/kicca?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-change-me}
      GH_ENC_KEY: ${GH_ENC_KEY:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      # task attachments (#34): S3 when S3_BUCKET set, else local volume
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      ATTACHMENTS_DIR: /data/attachments
      ATTACHMENTS_MAX_MB: ${ATTACHMENTS_MAX_MB:-25}
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      # ponytail: cluster inside the migrated pgdata volume still uses the
      # old kicca user/db — env vars must match it until the volume is rebuilt.
      POSTGRES_USER: kicca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kicca}
      POSTGRES_DB: kicca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicca -d kicca"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  attachments:
